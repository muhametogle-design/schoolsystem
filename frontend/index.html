<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SomTech — Private School Management & State Compliance Monitoring</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ================= LOGIN ================= -->
  <section id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="brand-badge">SOM</div>
        <div>
          <h1>SomTech SchoolSystem</h1>
          <p>Private School Management &amp; State Compliance Monitoring Platform</p>
        </div>
      </div>
      <form id="loginForm" class="login-form">
        <label>Email
          <input type="email" id="loginEmail" placeholder="you@portal.gov" required />
        </label>
        <label>Password
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign in</button>
        <p id="loginError" class="login-error hidden"></p>
      </form>
      <div class="demo-accounts">
        <p class="demo-title">Demo accounts (click to fill)</p>
        <button class="demo-chip" data-email="inspector@education.gov" data-pass="State@2026">
          🏛️ State Inspector <span>inspector@education.gov</span>
        </button>
        <button class="demo-chip" data-email="manager@greenfield.edu" data-pass="School@2026">
          🏫 School Manager — Greenfield <span>manager@greenfield.edu</span>
        </button>
        <button class="demo-chip" data-email="teacher@greenfield.edu" data-pass="Teach@2026">
          👩‍🏫 Teacher — Greenfield <span>teacher@greenfield.edu</span>
        </button>
        <button class="demo-chip" data-email="manager@horizon.edu" data-pass="School@2026">
          🚨 School Manager — Horizon (non-compliant) <span>manager@horizon.edu</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ================= APP SHELL ================= -->
  <div id="appView" class="app-shell hidden">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand-badge small">SOM</div>
        <div>
          <strong id="topTitle">SomTech SchoolSystem</strong>
          <span class="topbar-sub" id="topSub"></span>
        </div>
      </div>
      <div class="topbar-right">
        <span class="ws-pill" id="wsPill"><span class="dot"></span> connecting…</span>
        <span class="whoami" id="whoami"></span>
        <button class="btn btn-ghost" id="logoutBtn">Sign out</button>
      </div>
    </header>

    <div id="alarmBanner" class="alarm-banner hidden">
      <span id="alarmBannerText"></span>
      <button class="banner-close" onclick="this.parentElement.classList.add('hidden')">✕</button>
    </div>

    <div class="body-grid">
      <nav class="sidenav" id="sidenav"></nav>
      <main class="content" id="content"></main>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
