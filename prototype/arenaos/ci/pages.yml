name: Pages

# Publishes the standalone mock prototype (prototype/arenaos) to GitHub Pages.
# Manual trigger plus a push to main; Pages itself must be switched on once in
# Settings → Pages → Source: "GitHub Actions" (the token this workflow uses is
# not allowed to enable it programmatically).
#
# URL after a successful run: https://<org>.github.io/schoolsystem/prototype/

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'prototype/arenaos/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/arenaos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: prototype/arenaos/package-lock.json

      # npm ci is the online path: everything (react, vite, tailwind, esbuild)
      # comes from the registry, nothing from a copy of node_modules.
      - name: Install, build and test
        env:
          # absolute asset URLs, since the site lives in a subpath
          BASE_PATH: /schoolsystem/prototype/
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # dist/index.html is the landing page listing the two entry points.
          path: prototype/arenaos/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.out.outputs.page_url }}
    steps:
      - id: out
        uses: actions/deploy-pages@v4
