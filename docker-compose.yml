version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neemis
      POSTGRES_PASSWORD: neemis
      POSTGRES_DB: neemis
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neemis"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot service: applies the schema (already done by db init) and seeds
  # demo campus/users/civil-service grades, then exits.
  seed:
    build: .
    environment: &appenv
      DATABASE_URL: postgresql+psycopg2://neemis:neemis@db:5432/neemis
      JWT_ALGORITHM: HS256
      JWT_SECRET_KEY: change-me-docker-dev-secret-please-rotate-in-prod
      ALLOWED_ORIGINS: "*"
    command: ["python", "scripts/seed_data.py"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      <<: *appenv
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
